# Electron Builder 打包配置（方案 A 桌面端）
# ------------------------------------------------------------------
# 关键决策（详见 README「打包与原生模块分发」章节）：
#   1. npmRebuild: false
#      原生模块（node-pty / koffi）由「系统 Node 运行的 dsh 子进程」使用，
#      绝对不能用 Electron 的 ABI 重编译它们，否则子进程加载即崩溃。
#   2. asarUnpack 解包原生目录
#      Node 无法从 asar 压缩包内加载 .node / .dll / .exe，必须解包到真实文件系统。
#      node-pty 的预编译二进制随 npm 包分发；koffi 的二进制由 build:native 步骤物化，
#      二者均需解包。

appId: com.deepseek.harness.desktop
productName: DeepSeek Harness 桌面端
copyright: Copyright © 2026

directories:
  # 打包产物输出目录（与 tsc 的 dist 区分，避免混淆）
  output: dist-electron

files:
  - dist/**
  - package.json
  # 托盘/窗口图标：运行时从 asar 内读取 build/icon.png（黑鲸）
  - build/icon.png
  # ★ 全量包含 node_modules：electron-builder 默认只收集 dependencies 树，
  #   会漏掉 peerDependencies / optionalDependencies（实测缺
  #   @deepseek-ai/cordis-plugin-group 导致 dsh 启动 ERR_MODULE_NOT_FOUND）。
  #   dsh 依赖树庞大（60+ @deepseek-ai 包 + peer/optional），且 asarUnpack 已全量
  #   解包，files 同样全量包含保持一致。
  - "node_modules/**"
  # koffi 平台拆分包（@koromix/koffi-<os>-<arch>）：运行时按 process.platform-arch
  # 查找，显式声明保证全部带进包（Intel 正常、M 芯片 ERR_MODULE_NOT_FOUND 的根因）
  - "node_modules/@koromix/**"
  # 排除源码映射与版本控制目录，减小体积
  - "!**/*.map"
  - "!**/.git/**"

# 启用 asar 压缩（源码受保护），但下方 asarUnpack 会把运行所需内容解包出来
asar: true
# 整个 node_modules 解包到 app.asar.unpacked/（真实文件系统）。
# 原因：dsh 子进程由「系统 Node」运行，而系统 Node 无法读取 asar 内的文件——
# 若 dsh 及其 60+ 依赖留在 asar 里，子进程 require 即失败。
# 同时原生模块（node-pty / koffi）本就必须解包。代价是 node_modules 不压缩，
# 换来 dsh 子进程（含原生模块 ABI）可正常运行。
asarUnpack:
  - "**/node_modules/**"

# 关键：不要为 Electron 重编译原生模块（它们服务于系统 Node 的 dsh 子进程）
npmRebuild: false

# 内置 Node.js 运行时（v0.2.0）：
# 把 vendor/node/<os>-<arch>/ 精简后的 Node 拷进安装包 resources/node-runtime/，
# dsh 子进程优先使用内置 Node，用户无需预装系统 Node。
# 产物由 scripts/fetch-node.cjs 在打包前生成（node/ 官方发行包 → vendor/ 精简）。
extraResources:
  - from: vendor/node/${os}-${arch}
    to: node-runtime
    filter:
      - "**/*"

win:
  target:
    - nsis
  # 桌面端图标：多尺寸 ICO（16/24/32/48/64/128/256），由 scripts/generate-icon.cjs 从官方 SVG 编译生成
  icon: build/icon.ico
  # 产物文件名纯 ASCII（仅英文+连字符）：GitHub Release 会对资产名做 unicode 规范化，
  # 中文会被替换为 .（0.1.0 已验证：桌面端 → .），故文件名中避免中文与空格
  artifactName: DeepSeek-Harness-${version}-Setup.${ext}

mac:
  # macOS 产物名带架构后缀：避免 --x64 --arm64 双架构产物同名，
  # 否则 x64/arm64 的 dmg/zip 上传 GitHub Release 时互相覆盖
  artifactName: DeepSeek-Harness-${version}-${arch}.${ext}
  # macOS 图标：直接复用 build/icon.png（512×512 黑鲸），electron-builder 打包时自动转 icns
  icon: build/icon.png

linux:
  artifactName: DeepSeek-Harness-${version}-${arch}.${ext}

nsis:
  oneClick: false              # 非一键安装，展示安装向导
  perMachine: false            # 当前用户安装（无需管理员）
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: DeepSeek Harness 桌面端

# GitHub Release 发布通道（自动更新元数据）：
# 配置后打包会生成 latest.yml（Windows）/ latest-mac.yml（macOS），
# electron-updater 客户端据此检查/下载更新。发版走 scripts/publish-github.mjs。
publish:
  provider: github
  owner: lijian-ui
  repo: dsh-desktop
  # 不设置 private 属性：公开仓库默认无需 token（GitHub 对 public 资产的
  # 下载不鉴权）；私有仓库才需 GH_TOKEN 环境变量。
